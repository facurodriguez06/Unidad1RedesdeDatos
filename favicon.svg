<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="netGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="50%" stop-color="#F72585"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="14" fill="#001219"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#004658" stroke-width="2"/>

  <!-- Network Connection Lines -->
  <g stroke="url(#netGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="32" y1="16" x2="16" y2="44"/>
    <line x1="32" y1="16" x2="48" y2="44"/>
    <line x1="16" y1="44" x2="48" y2="44"/>
    <line x1="32" y1="16" x2="32" y2="33"/>
    <line x1="16" y1="44" x2="32" y2="33"/>
    <line x1="48" y1="44" x2="32" y2="33"/>
  </g>

  <!-- Network Nodes -->
  <!-- Center Core Node -->
  <circle cx="32" cy="33" r="5" fill="#F72585" filter="url(#glow)"/>
  <circle cx="32" cy="33" r="2.5" fill="#FFFFFF"/>

  <!-- Top Node -->
  <circle cx="32" cy="16" r="4.5" fill="#4CC9F0" filter="url(#glow)"/>
  <circle cx="32" cy="16" r="2" fill="#E0FBFC"/>

  <!-- Bottom Left Node -->
  <circle cx="16" cy="44" r="4.5" fill="#4CC9F0" filter="url(#glow)"/>
  <circle cx="16" cy="44" r="2" fill="#E0FBFC"/>

  <!-- Bottom Right Node -->
  <circle cx="48" cy="44" r="4.5" fill="#4CC9F0" filter="url(#glow)"/>
  <circle cx="48" cy="44" r="2" fill="#E0FBFC"/>

  <!-- Data Packet Indicator -->
  <circle cx="24" cy="30" r="1.8" fill="#FFD166"/>
</svg>
